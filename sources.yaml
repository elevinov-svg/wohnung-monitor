# Источники для мониторинга.
#
# Типы источников:
#   type: rss         — обычный RSS/Atom-фид
#   type: html_links  — страница без RSS: ищем ссылки по regex в link_pattern
#   type: company     — сайт городской жилищной компании, парсер в landeseigene.py
#                       (company: howoge | degewo | wbm | gesobau | gewobag |
#                        stadtundland | inberlinwohnen)

# Фильтр для источников type: company. Если у объявления поле неизвестно,
# оно по этому полю НЕ отсеивается (лучше лишняя строка, чем пропущенная квартира).
filters:
  berlin_only: true    # отбрасываем Бранденбург (Panketal, Fredersdorf и т.п.)
  max_rooms: 2         # 1–2 комнаты
  max_warm: 750        # € Warmmiete — грубый верхний порог
  max_kalt: 600        # € Kaltmiete — используется, если Warmmiete неизвестна
  max_km_boxhagener_platz: 3.5   # радиус от Boxhagener Platz, км (по прямой)
  green_km: 2.0                  # до этого расстояния — приоритет 🟢
  # Лимит Jobcenter (AV Wohnen 2026, 1 чел.): Bruttokaltmiete 449 €, с надбавкой до ~539 €.
  # Точная оценка — в колонке «Jobcenter» таблицы, а не здесь.

sources:
  # --- Кооперативы -----------------------------------------------------------
  - name: "FriedrichsHeim eG — для всех"
    type: rss
    url: "https://www.friedrichsheim-eg.de/category/wohnungsangebote-fuer-alle/feed/"

  - name: "FriedrichsHeim eG — только для членов"
    type: rss
    url: "https://www.friedrichsheim-eg.de/category/wohnungsangebote-fuer-mitglieder/feed/"

  # --- Городские жилищные компании (landeseigene), прямо с их сайтов ----------
  - name: "HOWOGE"
    type: company
    company: howoge

  - name: "degewo"
    type: company
    company: degewo

  - name: "WBM"
    type: company
    company: wbm

  - name: "GESOBAU"
    type: company
    company: gesobau

  - name: "Gewobag"
    type: company
    company: gewobag

  - name: "Stadt und Land"
    type: company
    company: stadtundland

  # --- Общий портал: контроль и замер задержки относительно сайтов компаний ---
  # Стоит ПОСЛЕ компаний: если квартира уже найдена на сайте компании,
  # второй строки в таблице не будет — только отметка времени в timing.json.
  - name: "inberlinwohnen.de"
    type: company
    company: inberlinwohnen
