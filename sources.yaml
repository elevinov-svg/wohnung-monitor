# Источники для мониторинга.
#
# Каждый источник — это либо:
#   type: rss         — обычный RSS/Atom-фид (самый надёжный вариант)
#   type: html_links   — страница без RSS: скрипт скачивает HTML и ищет
#                        ссылки, подходящие под regex в link_pattern
#
# Проверено вручную и работает прямо сейчас:

sources:
  - name: "FriedrichsHeim eG — для всех"
    type: rss
    url: "https://www.friedrichsheim-eg.de/category/wohnungsangebote-fuer-alle/feed/"

  - name: "FriedrichsHeim eG — только для членов"
    type: rss
    url: "https://www.friedrichsheim-eg.de/category/wohnungsangebote-fuer-mitglieder/feed/"

  # --- Шаблоны для следующих источников -------------------------------
  # Раскомментируй и донастрой, когда будем добавлять их по очереди.
  # Для html_links нужно один раз открыть страницу в браузере, посмотреть
  # на реальные ссылки в исходном коде (Ctrl+U) и подобрать link_pattern —
  # кусок URL, который есть у ссылки на объявление, но нет у остальных
  # ссылок на странице (меню, футер и т.п.).

