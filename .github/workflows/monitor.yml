name: Wohnung Monitor

on:
  schedule:
    # Каждые 30 минут. GitHub Actions иногда задерживает cron на несколько
    # минут при высокой нагрузке на их стороне — это нормально, не баг.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      self_test:
        description: "Записать одну тестовую строку в таблицу (для проверки доступа), затем можно удалить её вручную"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write   # нужно, чтобы коммитить обновлённое состояние обратно в репозиторий

concurrency:
  group: wohnung-monitor   # не запускать два прогона одновременно
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить мониторинг
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Telegram пока отключён (USE_TELEGRAM=false по умолчанию в monitor.py).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SELF_TEST_SHEETS: ${{ github.event.inputs.self_test }}
        run: python monitor.py

      - name: Сохранить состояние (seen.json, timing.json, geocache.json)
        run: |
          git config user.name "wohnung-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in seen.json timing.json geocache.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || git commit -m "update seen state [skip ci]"
          git pull --rebase && git push
