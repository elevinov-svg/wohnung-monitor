name: Wohnung Monitor

on:
  schedule:
    # Запуск каждые 30 минут. Каждый прогон сам работает ~50 минут и проверяет
    # сайты каждые 3 минуты. Благодаря concurrency следующий прогон ждёт окончания
    # текущего — получается почти непрерывный мониторинг.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      self_test:
        description: "Тестовая строка в таблицу и в базу (проверка доступа)"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Только лог: ничего не писать ни в таблицу, ни в базу"
        required: false
        default: false
        type: boolean

permissions:
  contents: read   # состояние хранится в Supabase, в репозиторий ничего не коммитим

concurrency:
  group: wohnung-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Самопроверка записи (таблица + база)
        if: github.event.inputs.self_test == 'true'
        run: python run.py --self-test

      - name: Мониторинг в цикле
        if: github.event.inputs.self_test != 'true'
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
        # Код выхода 1 только когда парсер компании ПЕРЕШЁЛ в состояние alert —
        # тогда прогон красный и GitHub присылает письмо (один раз, а не каждые 30 минут).
        run: python run.py --loop-minutes 50 --interval 180
