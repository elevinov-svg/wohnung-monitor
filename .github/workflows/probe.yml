name: Probe sources (разведка)

on:
  push:
    branches: [probe]
    paths: ["probe.py", ".github/workflows/probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python probe.py
      - name: Сохранить результаты в ветку probe
        run: |
          git config user.name "wohnung-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe_out
          git diff --staged --quiet || git commit -m "probe results [skip ci]"
          git push
