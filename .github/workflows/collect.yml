name: Collect-only (замер сбора)

# Замер качества СБОРА с IP GitHub Actions. Ничего не пишет ни в Supabase, ни в
# Google-таблицу (секреты не передаются). Результат — артефакт workflow.
# Запуск: push в ветку collect-measure или вручную (Re-run / workflow_dispatch).
on:
  push:
    branches: [collect-measure]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-measure
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Ответы сайтов (статус, заголовки CDN/защиты)
        run: python scripts/probe_sites.py | tee probe.txt

      - name: Сбор (один полный прогон + один повторный через 3 минуты)
        run: |
          python collect.py --out data/collect 2>&1 | tee collect.log
          sleep 180
          python collect.py --out data/collect 2>&1 | tee -a collect.log

      - name: Артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/collect/
            collect.log
            probe.txt
          retention-days: 14
