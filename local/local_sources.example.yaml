# Скопируй этот файл в local_sources.yaml и вставь свои ссылки.
#
# Как получить url: открой сайт в обычном браузере, настрой поиск своими
# фильтрами (район, цена, комнаты, WBS и т.д.) через интерфейс сайта,
# скопируй итоговый URL страницы результатов — и вставь сюда как есть.
#
# link_pattern — кусок URL, характерный именно для ссылки на одно
# объявление (не для меню/футера/рекламы). Чтобы найти свой:
#   1. Открой любое объявление на сайте.
#   2. Посмотри на URL в адресной строке.
#   3. Возьми из него стабильную часть (например "/expose/" у ImmoScout24).

sources:
  - name: "ImmoScout24 — мой поиск"
    url: "ВСТАВЬ_СЮДА_СВОЙ_URL_ПОИСКА"
    link_pattern: "/expose/[0-9]+"

  - name: "Immowelt — мой поиск"
    url: "ВСТАВЬ_СЮДА_СВОЙ_URL_ПОИСКА"
    link_pattern: "/expose/[0-9]+"

  - name: "Kleinanzeigen — Nachmieter WBS"
    url: "ВСТАВЬ_СЮДА_СВОЙ_URL_ПОИСКА"
    link_pattern: "/s-anzeige/"
